name: Release

# On a v* tag: build the wasm from source, run the tests, publish to npm with
# provenance via OIDC trusted publishing (no NPM_TOKEN secret required — the
# package's Trusted Publisher is configured on npmjs.com), and cut a GitHub
# Release with the built artifacts attached.
#
# Cut a release with:  npm version <patch|minor|major> && git push --follow-tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build & publish (e.g. v1.5.0)'
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org' # required for OIDC trusted publishing

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.4
          actions-cache-folder: emsdk-cache

      - run: npm ci

      - name: Build wasm from source
        run: bash compileLibraw.sh

      - name: Unit test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration test
        run: npm run test:integration

      - name: Upgrade npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Publish to npm (provenance via OIDC trusted publishing)
        run: |
          echo "npm $(npm --version) / node $(node --version)"
          VERSION=$(node -p "require('./package.json').version")
          # Idempotent: a tag push and a manual re-run can both fire for the same
          # version; skip (don't fail) if it's already on npm so the release still
          # completes and the GitHub Release step below still runs.
          if npm view "libraw-wasm@${VERSION}" version >/dev/null 2>&1; then
            echo "libraw-wasm@${VERSION} is already published — skipping npm publish."
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            libraw.wasm
            dist/**
